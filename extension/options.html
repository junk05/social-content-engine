<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Social Content Engine</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>Threads Collector</h1>
      <p id="status">状態を確認しています。</p>
      <p>受信先: <code>http://127.0.0.1:8765/browser-ingest/threads</code></p>
      <p>人が選んだ観測だけをloopback receiverへ送信します。</p>
      <p id="queue-summary" aria-live="polite">詳細queueを確認しています。</p>
      <button id="load-pending" type="button">詳細待ちを読み込む</button>
      <button id="start-detail-batch" type="button">詳細をまとめて補完</button>
      <button id="resume-detail-batch" type="button">中断した詳細補完を再開</button>
      <button id="run-debugger-spike" type="button">1件だけActivity表示を検証</button>
      <p id="debugger-spike-status" aria-live="polite"></p>
      <button id="run-debugger-foreground-spike" type="button">1件だけ前面化してActivity表示を検証</button>
      <p id="debugger-foreground-spike-status" aria-live="polite"></p>
      <button id="run-native-input-spike" type="button">1件だけmacOS実マウス入力を検証</button>
      <p id="native-input-spike-status" aria-live="polite"></p>
      <button id="run-native-input-diagnostic" type="button">macOS入力helperを診断</button>
      <p id="native-input-diagnostic-status" aria-live="polite"></p>
      <button id="run-native-cursor-calibration" type="button">1件だけカーソル位置を校正</button>
      <p id="native-cursor-calibration-status" aria-live="polite"></p>
      <p id="batch-status" aria-live="polite"></p>
      <p id="pending-status">詳細待ちはまだ読み込んでいません。</p>
      <ul id="pending-details"></ul>
      <section aria-labelledby="collected-heading">
        <h2 id="collected-heading">収集済み投稿一覧</h2>
        <label>状態
          <select id="collected-filter">
            <option value="ALL">ALL</option>
            <option value="DETAIL_PENDING">DETAIL_PENDING</option>
            <option value="DETAIL_FAILED">DETAIL_FAILED</option>
            <option value="DETAIL_ENRICHED">DETAIL_ENRICHED</option>
            <option value="EXCLUDED">EXCLUDED</option>
          </select>
        </label>
        <label>並び順
          <select id="collected-sort">
            <option value="newest">新しい順</option>
            <option value="oldest">古い順</option>
            <option value="error_first">エラー優先</option>
          </select>
        </label>
        <button id="refresh-collected" type="button">一覧を更新</button>
        <p id="collected-status" aria-live="polite">一覧を読み込んでいます。</p>
        <div class="table-scroll">
          <table>
            <thead><tr>
              <th>収集日時・投稿</th><th>状態</th><th>観測</th><th>操作</th>
            </tr></thead>
            <tbody id="collected-posts"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
