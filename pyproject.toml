[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-content-engine"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.20,<5", "rfc3339-validator>=0.1.4,<1"]

[project.optional-dependencies]
dev = ["mypy>=1.10,<2", "ruff>=0.6,<1"]

[project.scripts]
sce-threads-spike = "social_content_engine.collector.spike:main"
sce-meta-callbacks = "social_content_engine.callbacks.server:main"
sce-analyze = "social_content_engine.analyzer.cli:main"
sce-threads-batch = "social_content_engine.collector.batch:main"
sce-build-dataset = "social_content_engine.data.dataset:main"
sce-browser-ingest = "social_content_engine.browser_ingest.server:main"
sce-browser-bridge = "social_content_engine.data.browser_bridge:main"
sce-prepare-detail-batch = "social_content_engine.intelligence.detail_batch:main"
sce-requeue-invalid-detail-text = "social_content_engine.intelligence.requeue_invalid_detail:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["social_content_engine"]
