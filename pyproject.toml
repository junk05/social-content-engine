[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-content-engine"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.20,<5", "rfc3339-validator>=0.1.4,<1"]

[project.optional-dependencies]
dev = ["mypy>=1.10,<2", "ruff>=0.6,<1"]

[project.scripts]
sce-threads-spike = "social_content_engine.collector.spike:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["social_content_engine"]
